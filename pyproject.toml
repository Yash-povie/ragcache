[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragcache"
version = "0.1.0"
description = "Semantic caching layer for RAG pipelines — cut LLM costs 40-70% with Redis vector search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["RAG", "cache", "redis", "vector-search", "LLM", "semantic-cache", "langchain", "llamaindex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "redisvl>=0.3.0",
    "numpy>=1.24",
    "redis>=5.0",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=2.7"]
openai = ["openai>=1.30"]
fastapi = ["fastapi>=0.111", "pydantic>=2.0"]
benchmark = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "sentence-transformers>=2.7",
    "fastapi>=0.111",
    "pydantic>=2.0",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/Yash-povie/ragcache"
Repository = "https://github.com/Yash-povie/ragcache"
Issues = "https://github.com/Yash-povie/ragcache/issues"

[tool.hatch.build.targets.wheel]
packages = ["ragcache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
